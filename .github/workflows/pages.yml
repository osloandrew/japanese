name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          # The Updates page reads opt-in [update] commits from Git history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pages.txt

      # The static artifact must reference a fresh URL whenever a local
      # script or stylesheet changes; otherwise returning visitors can keep
      # an old browser-cached asset after this deployment.
      - name: Verify cache-busted asset versions
        run: python3 scripts/stamp-asset-versions.py --check

      - name: Restore compatible rendered pages
        uses: actions/cache@v4
        with:
          path: |
            word
            story
            stories
            sentences
            word-game
            pronunciation
            updates
            sitemap.xml
            page-manifest.json
            .pages-cache
          # Keep one restorable lineage per renderer, but give every data
          # revision its own key. actions/cache entries are immutable: without
          # the data suffix, each run would forever restore the first snapshot
          # and the incremental diff would grow on every upload.
          key: pages-v1-${{ hashFiles('index.html', '*.js', 'styles/**/*.css', 'scripts/**/*.py', 'make-sitemap.py', 'requirements-pages.txt', 'inflections-data.json', 'japaneseSounds.csv') }}-${{ hashFiles('japaneseWords.csv', 'japaneseStories.csv', 'japaneseAuthenticStories.csv') }}
          restore-keys: |
            pages-v1-${{ hashFiles('index.html', '*.js', 'styles/**/*.css', 'scripts/**/*.py', 'make-sitemap.py', 'requirements-pages.txt', 'inflections-data.json', 'japaneseSounds.csv') }}-

      - name: Install page builder
        run: |
          python -m pip install --requirement requirements-pages.txt
          python -m playwright install --with-deps chromium

      - name: Run application tests
        run: |
          npm test

      - name: Capture the exact rendered application pages
        run: python scripts/build-static-pages.py --incremental

      - name: Verify representative rendered pages
        run: |
          python scripts/verify-static-page-equivalence.py \
            --word 今日 --word 電車 --word "と言う" \
            --story 遊園地での一日 --story 上野動物園での一日
          python scripts/verify-static-page-equivalence.py \
            --root-mount --word 今日 --story 遊園地での一日

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload generated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
